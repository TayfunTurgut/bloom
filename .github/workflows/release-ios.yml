name: Release (iOS)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to App Store Connect"
        type: boolean
        default: false

concurrency:
  group: release-ios
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODE_VERSION: "26"
  BUNDLE_ID: com.tayfunturgut.bloom
  ARCHIVE_PATH: ${{ github.workspace }}/build/App.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/export

jobs:
  archive:
    name: Archive and export
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode ${XCODE_VERSION} not found on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version and build number
        id: version
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          echo "marketing=$version" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building $version ($GITHUB_RUN_NUMBER)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Xcode project version is in sync
        run: pnpm run version:sync --check

      - name: Build web and sync native project
        run: pnpm ios:sync

      - name: Cache resolved Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Import signing certificate and profile
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          profile="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROVISIONING_PROFILE" | base64 --decode > "$profile"
          plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"

          for dir in \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
          rm -f "$profile" "$plist"

          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "profile_name=$name" >> "$GITHUB_OUTPUT"
          echo "Installed profile: $name"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CURRENT_PROJECT_VERSION='${{ steps.version.outputs.build }}' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER='${{ steps.signing.outputs.profile_name }}' \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing.outputs.keychain }}"

      - name: Write export options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${{ steps.signing.outputs.profile_name }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -lh "$EXPORT_PATH"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloom-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.build }}
          path: ${{ env.EXPORT_PATH }}/*.ipa
          retention-days: 30

      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: dsyms-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.build }}
          path: ${{ env.ARCHIVE_PATH }}/dSYMs
          retention-days: 30

      - name: Upload to App Store Connect
        if: github.ref_type == 'tag' || inputs.upload
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keydir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keydir"
          echo "$API_PRIVATE_KEY" | base64 --decode > "$keydir/AuthKey_${API_KEY_ID}.p8"
          ipa="$(find "$EXPORT_PATH" -name '*.ipa' -maxdepth 1 | head -n 1)"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          rm -rf "$keydir"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
