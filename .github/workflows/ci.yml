name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build web + verify native sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Verify Xcode project version is in sync
        run: pnpm run version:sync --check

      - name: Build
        run: pnpm build

      - name: Verify generated asset types are committed
        run: |
          if ! git diff --exit-code -- src/assetpack/assets.d.ts; then
            echo "::error file=src/assetpack/assets.d.ts::Out of date. Run 'pnpm assetpack' and commit the result."
            exit 1
          fi

      - name: Sync native project
        run: pnpm exec cap sync ios

      - name: Verify native package manifest is committed
        run: |
          if ! git diff --exit-code -- ios/App/CapApp-SPM/Package.swift; then
            echo "::error file=ios/App/CapApp-SPM/Package.swift::Out of date. Run 'pnpm ios:sync' and commit the result."
            exit 1
          fi

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
